# Character skills. Ids are kept from the first design (clients and admin key on them); the
# effect types are described in internal/game/match/skill_*.go; their numbers are params.
# projectileCount is informational (rank 0); damageMultiplier scales the whole skill's damage
# (bloom heals a percent of max HP and ignores it).
- skillId: triple_shot
  characterId: rookie
  name: Mưa tên lửa
  cooldownTurn: 2
  effectType: missile_rain
  projectileCount: 12
  statusEffectId: burn
  damageMultiplier: 1.0
  description: "Bắn pháo hiệu; tên lửa rơi xuống quanh chỗ nó đáp (12 quả, +4 mỗi cấp súng), mỗi quả 25% sát thương; địch trúng bị bỏng: mất 10% máu tối đa đầu lượt sau."
  descriptionTemplate: "Bắn pháo hiệu, {count} tên lửa rơi quanh chỗ đáp (+{countPerRank} mỗi cấp súng), mỗi quả {damagePct}% sát thương; địch trúng bị bỏng: mất {burnPct}% máu tối đa đầu lượt sau."
  # the effect type's tuning (config_skills.params; gamedata.SkillParamSpecs)
  params: {baseCount: 12, countPerRank: 4, spreadBase: 90, spreadPerRank: 15, focus: 2, delay: 0.5, interval: 0.05, startY: -60, dropSpeed: 1500, damage: 0.25, blast: 0.7, crater: 1, cap: 2, burnTurns: 1}

- skillId: heavy_bomb
  characterId: tanko
  name: Bom liên hoàn
  cooldownTurn: 3
  effectType: bomb_chain
  projectileCount: 2
  statusEffectId: root
  damageMultiplier: 1.0
  description: "Bắn liên tiếp bom lớn cùng một đường bay (2 quả, +1 mỗi cấp súng), đào sâu một hố; mỗi quả 60% sát thương (34% ở cấp súng 4), mỗi địch nhận tối đa 120% (+15% mỗi cấp); địch trúng bị cầm chân lượt sau."
  descriptionTemplate: "Bắn {count} quả bom lớn liên tiếp cùng đường bay (+{countPerRank} mỗi cấp súng), đào sâu một hố; mỗi quả {eachPct}% sát thương, mỗi địch nhận tối đa {capPct}%; địch trúng bị cầm chân lượt sau."
  # the effect type's tuning (config_skills.params; gamedata.SkillParamSpecs)
  params: {baseCount: 2, countPerRank: 1, launchGap: 0.1, totalBase: 1.8, totalPerRank: 0.15, capBase: 1.2, capPerRank: 0.15, blast: 1.3, fallSpeed: 3, hitGap: 0.08, rootTurns: 1}

- skillId: shock_field
  characterId: spark
  name: Tia laze
  cooldownTurn: 3
  effectType: laser
  projectileCount: 1
  statusEffectId: stun
  damageMultiplier: 1.0
  description: "Tia thẳng xuyên địa hình tới mép bản đồ, trúng mọi địch trên đường: 150% sát thương (+10% mỗi cấp súng), mỗi địch sau giảm 20%; địch trúng bị choáng, mất lượt sau."
  descriptionTemplate: "Tia thẳng xuyên địa hình tới mép bản đồ, trúng mọi địch trên đường: {firstPct}% sát thương, mỗi địch sau giảm {decayPct}%; địch trúng bị choáng, mất lượt sau."
  # the effect type's tuning (config_skills.params; gamedata.SkillParamSpecs)
  params: {halfWidth: 10, firstBase: 1.5, firstPerRank: 0.1, decay: 0.8, chargeTime: 0.3, beamTime: 0.6, sweepSpeed: 12000, stunTurns: 1}

- skillId: healing_bloom
  characterId: flora
  name: Hoa hồi xuân
  cooldownTurn: 3
  effectType: bloom
  projectileCount: 1
  statusEffectId: ""
  damageMultiplier: 1.0
  description: "Hồi máu cả đội theo máu tối đa: Flora 40%, đồng đội 30% (+5% mỗi cấp súng); máu dư thành khiên (tối đa 50% máu); giải mọi hiệu ứng xấu."
  descriptionTemplate: "Hồi máu cả đội: Flora {selfPct}%, đồng đội {allyPct}% máu tối đa (+{perRankPct}% mỗi cấp súng); máu dư thành khiên (tối đa {shieldCapPct}% máu); giải mọi hiệu ứng xấu."
  # the effect type's tuning (config_skills.params; gamedata.SkillParamSpecs)
  params: {selfBase: 40, allyBase: 30, perRank: 5, riseTime: 0.55, crossTime: 0.2, fallTime: 0.65, skyY: -140, fallSpeed: 400, linger: 0.9}
